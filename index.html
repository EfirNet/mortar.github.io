<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відважні Серця | 3МБ 115 ОМБр</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            overflow: hidden;
            color: white;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)), 
                        url('https://images.unsplash.com/photo-1609854143922-9f9f9f9f9f9f') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 25px;
            opacity: 0.95;
        }
        .desc {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 35px;
            opacity: 0.9;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            background: rgba(220, 20, 60, 0.9);
            color: white;
            padding: 16px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #dc143c;
        }
        .btn.donate {
            background: #ffd700;
            color: #000;
            font-size: 1.15rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 { font-size: 1.9rem; }
            .container { padding: 15px; }
        }
        @media (min-width: 768px) {
            .container { max-width: 520px; }
            h1 { font-size: 2.5rem; }
        }
        @media (min-width: 1024px) {
            .container { max-width: 560px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ВІДВАЖНІ СЕРЦЯ</h1>
        <p class="subtitle">Мінометна Батарея • 115 ОМБр</p>
        
        <p class="desc">
            Ми — мінометники, які тримають лінію оборони. 
            Підтримай нас постійними донатами.
        </p>
        
        <div class="buttons">
            <a href="https://t.me/yourchannel" class="btn" target="_blank">Telegram</a>
            <a href="https://instagram.com/yourpage" class="btn" target="_blank">Instagram</a>
            <a href="https://facebook.com/yourpage" class="btn" target="_blank">Facebook</a>
            <a href="https://your-donation-link.monobank.ua" class="btn donate" target="_blank">🚀 Підтримати постійним донатом</a>
            <a href="https://your-donation-link" class="btn" target="_blank">Актуальні збори</a>
        </div>
    </div>
</body>
</html>
